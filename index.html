<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helpr Healthcare</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --fg: #0b2340;
        --accent: #1f7a8c;
        --muted: #5a6a7d;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #f6f8fb 0%, #e6eef6 100%);
        color: var(--fg);
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        margin: 0 0 1rem;
        line-height: 1.1;
      }
      p {
        font-size: 1.125rem;
        color: var(--muted);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Helpr Healthcare</span>
      <h1>Hello, world.</h1>
      <p>Welkom. Hier bouwen we de toekomst van zorg.</p>
    </main>
  </body>
</html>
